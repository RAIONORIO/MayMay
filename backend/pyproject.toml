[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maymay-backend"
version = "0.1.0"
description = "Núcleo local da assistente pessoal MayMay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "sherpa-onnx>=1.13,<2",
    "sherpa-onnx-core==1.13.4",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
maymay = "maymay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["maymay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
