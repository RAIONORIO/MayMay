[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maymay-backend"
version = "0.1.0"
description = "Núcleo local da assistente pessoal MayMay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
maymay = "maymay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["maymay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
